[package]
name = "stickies"
version = "0.1.0"
description = "Sticky notes with a plain-folder data model"
authors = ["David Piepgrass"]
edition = "2021"
license = "Unlicense"

[lib]
name = "stickies_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
notify-debouncer-mini = "0.6"
chrono = "0.4"
dirs = "6"
log = "0.4"
env_logger = "0.11"

[target.'cfg(not(windows))'.dependencies]
arboard = "3.6"
png = "0.18"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
windows = { version = "0.61", features = [
  "Foundation", "Foundation_Collections", "Globalization",
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
