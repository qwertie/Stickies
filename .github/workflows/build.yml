name: Build installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bundles: nsis
            artifact: app/src-tauri/target/release/bundle/nsis/*.exe
          - name: macos-arm64
            os: macos-latest
            bundles: dmg
            artifact: app/src-tauri/target/release/bundle/dmg/*.dmg
          - name: macos-x64
            os: macos-15-intel
            bundles: dmg
            artifact: app/src-tauri/target/release/bundle/dmg/*.dmg
          - name: linux-x64
            os: ubuntu-22.04
            bundles: appimage,deb
            artifact: |
              app/src-tauri/target/release/bundle/appimage/*.AppImage
              app/src-tauri/target/release/bundle/deb/*.deb
          - name: linux-arm64
            os: ubuntu-22.04-arm
            bundles: appimage,deb
            artifact: |
              app/src-tauri/target/release/bundle/appimage/*.AppImage
              app/src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies (WebKitGTK, tray, AppImage tooling)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf build-essential libssl-dev libxdo-dev libgtk-3-dev file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - run: npm ci
        working-directory: app

      # Tagged pushes publish one GitHub Release with every platform's installer attached.
      - uses: tauri-apps/tauri-action@v0
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_name }}
          releaseName: Stickies ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false

      # Every other build uploads the installer as a workflow artifact.
      - run: npm run tauri build -- --bundles ${{ matrix.bundles }}
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: app

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: stickies-${{ matrix.name }}
          path: ${{ matrix.artifact }}
